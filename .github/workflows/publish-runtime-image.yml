# Publish runtime images to GHCR.
#
# Trigger: a PR merged into main (or manual dispatch) — the image content
# merge IS the release event. The image reference is derived from this repo:
#   upstream pin  <- tradingagents/Dockerfile (ARG TA_VERSION)
#   shim revision <- SHIM_REVISION below
# so bumping either (and merging) publishes a new reference.
#
# A published reference is never overwritten: once it exists, a merge that
# does not bump either only publishes the commit's own sha-<commit> tag (and
# warns). Change the shim and leave SHIM_REVISION alone, and nothing new is
# released under the catalog's reference.
#
# ClawUp's catalog (backend/bot_runtimes.json, tradingagents.default_image)
# must carry the SAME reference — keep them in sync when bumping.
name: publish-runtime-image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  SHIM_REVISION: shim8

jobs:
  tradingagents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve image reference
        id: ref
        run: |
          ta_version=$(sed -n 's/^ARG TA_VERSION=//p' tradingagents/Dockerfile | head -1 | sed 's/^v//')
          if [ -z "$ta_version" ]; then
            echo "::error::could not read TA_VERSION from tradingagents/Dockerfile"
            exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tradingagents:${ta_version}-${SHIM_REVISION}"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
        run: |
          set -euo pipefail
          # Never move a reference a catalog may already point at.
          if out=$(docker buildx imagetools inspect "$IMAGE" 2>&1); then
            exists=1
          elif grep -qi "not found" <<<"$out"; then
            exists=0
          else
            echo "::error::could not check whether $IMAGE exists: $out"
            exit 1
          fi
          candidate="${IMAGE%:*}:sha-$(git rev-parse HEAD)"
          docker build \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            -t "$candidate" \
            -f tradingagents/Dockerfile tradingagents
          docker push "$candidate"
          if [ "$exists" = 1 ]; then
            echo "::warning::$IMAGE is already published and is left as it is; bump SHIM_REVISION (or TA_VERSION) to release this build. It is published only as $candidate."
            exit 0
          fi
          docker tag "$candidate" "$IMAGE"
          docker push "$IMAGE"
          echo "published $IMAGE"
