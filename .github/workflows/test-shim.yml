# Behavior tests for the runtime shims (stdlib-only), and the built image end to end.
name: test-shim

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Run TradingAgents shim tests
        run: python3 -m unittest discover -s tradingagents/tests -v

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the TradingAgents image
        run: docker build -t ta:test -f tradingagents/Dockerfile tradingagents

      - name: Run the image end to end (Telegram stand-in -> channel gateway -> shim)
        env:
          TA_IMAGE: ta:test
        run: python3 -m unittest -v tradingagents/tests/test_image.py

      - name: Run the tests that need the Hyperliquid SDK, with the image's own
        run: >-
          docker run --rm -v "$PWD/tradingagents:/w:ro" -w /w --entrypoint /opt/hl/bin/python ta:test
          -m unittest -v tests.test_hl_trade.SignsForTheSdk tests.test_panel.AsTheSdkSigns
