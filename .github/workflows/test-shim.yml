# Behavior tests for the runtime shims (stdlib-only, no docker needed).
name: test-shim

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run TradingAgents shim tests
        run: python3 -m unittest discover -s tradingagents/tests -v
